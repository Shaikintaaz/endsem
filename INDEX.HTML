
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Admission Form</title>

    <link rel="stylesheet" href="Style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Student Admission Form</h1>
            <p>Welcome! Please fill in your details to apply for admission.</p>
        </div>

        <form>

            <h2>Personal Information</h2>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" placeholder="Enter mobile number"
                       pattern="[0-9]{10}" maxlength="10" required>
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea placeholder="Enter your address"
                          rows="3" required></textarea>
            </div>

            <h2>Academic Information</h2>

            <div class="form-group">
                <label>Previous Qualification</label>
                <select required>
                    <option value="">Select Qualification</option>
                    <option>10th</option>
                    <option>Intermediate</option>
                    <option>Diploma</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>School / College Name</label>
                <input type="text" placeholder="Enter institution name" required>
            </div>

            <div class="form-group">
                <label>Course Applying For</label>
                <select required>
                    <option value="">Select Course</option>
                    <option>B.Tech - CSE</option>
                    <option>B.Tech - ECE</option>
                    <option>B.Tech - EEE</option>
                    <option>B.Tech - Civil</option>
                    <option>BBA</option>
                    <option>BCA</option>
                </select>
            </div>

            <div class="form-group">
                <label>Year of Admission</label>
                <select required>
                    <option value="">Select Year</option>
                    <option>2026-2027</option>
                    <option>2027-2028</option>
                </select>
            </div>

            <div class="form-group">
                <label>Upload Photograph</label>
                <input type="file" accept="image/*">
            </div>

            <div class="form-group">
                <label>Upload Previous Marks Memo</label>
                <input type="file" accept=".pdf,image/*">
            </div>

            <div class="checkbox">
                <input type="checkbox" required>
                <span>I confirm that the information provided is correct.</span>
            </div>

            <button type="submit">Submit Application</button>

            <p class="footer">© 2026 Student Admission Portal</p>

        </form>

    </div>

</body>
</html>
